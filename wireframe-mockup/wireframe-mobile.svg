<svg viewBox="0 0 360 900" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="360" height="900" fill="#ffffff" stroke="#999" stroke-width="2"/>
  <!-- Nav -->
  <rect x="0" y="0" width="360" height="60" fill="#e8e8e8" stroke="#999"/>
  <text x="20" y="35" font-size="14" fill="#333">LOGO</text>
  <text x="200" y="20" font-size="10" fill="#666">home</text>
  <text x="200" y="34" font-size="10" fill="#666">about</text>
  <text x="200" y="48" font-size="10" fill="#666">contact / blog</text>

  <!-- Masthead -->
  <rect x="0" y="60" width="360" height="220" fill="#cfcfcf" stroke="#999"/>
  <text x="30" y="180" font-size="18" fill="#333">TAGLINE</text>

  <!-- Main content, 2rem gutter -->
  <rect x="32" y="312" width="296" height="500" fill="#ffffff" stroke="#bbb" stroke-dasharray="4"/>
  <!-- buttons -->
  <rect x="32" y="312" width="88" height="36" fill="#4a7c59" stroke="#333"/>
  <text x="45" y="335" font-size="10" fill="#fff">Btn 1 (active)</text>
  <rect x="128" y="312" width="88" height="36" fill="#e0e0e0" stroke="#333"/>
  <text x="145" y="335" font-size="10" fill="#333">Btn 2</text>
  <rect x="224" y="312" width="88" height="36" fill="#e0e0e0" stroke="#333"/>
  <text x="241" y="335" font-size="10" fill="#333">Btn 3</text>

  <text x="32" y="380" font-size="16" fill="#222">Heading</text>
  <rect x="32" y="395" width="296" height="140" fill="#dcdcdc" stroke="#999"/>
  <text x="130" y="470" font-size="10" fill="#666">image</text>
  <line x1="32" y1="555" x2="328" y2="555" stroke="#ccc"/>
  <line x1="32" y1="575" x2="328" y2="575" stroke="#ccc"/>
  <line x1="32" y1="595" x2="328" y2="595" stroke="#ccc"/>
  <line x1="32" y1="615" x2="260" y2="615" stroke="#ccc"/>

  <!-- Footer -->
  <rect x="0" y="840" width="360" height="60" fill="#333"/>
  <circle cx="140" cy="870" r="10" fill="#fff"/>
  <circle cx="180" cy="870" r="10" fill="#fff"/>
  <circle cx="220" cy="870" r="10" fill="#fff"/>
  <text x="100" y="900" font-size="9" fill="#999">social icons centered</text>
</svg>
