<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="960" height="640" fill="#ffffff" stroke="#999" stroke-width="2"/>
  <!-- Nav -->
  <rect x="0" y="0" width="960" height="60" fill="#e8e8e8" stroke="#999"/>
  <text x="30" y="35" font-size="16" fill="#333">LOGO</text>
  <text x="620" y="35" font-size="12" fill="#666">home</text>
  <text x="700" y="35" font-size="12" fill="#666">about</text>
  <text x="780" y="35" font-size="12" fill="#666">contact</text>
  <text x="860" y="35" font-size="12" fill="#666">blog</text>

  <!-- Masthead -->
  <rect x="0" y="60" width="960" height="200" fill="#cfcfcf" stroke="#999"/>
  <text x="360" y="165" font-size="22" fill="#333">TAGLINE (centered, max-width 60rem)</text>

  <!-- Centered content column, max-width 60rem ~ 960px, so full width here -->
  <rect x="40" y="290" width="880" height="260" fill="#ffffff" stroke="#bbb" stroke-dasharray="4"/>
  <rect x="40" y="290" width="120" height="36" fill="#4a7c59" stroke="#333"/>
  <text x="55" y="313" font-size="11" fill="#fff">Btn 1 active</text>
  <rect x="170" y="290" width="120" height="36" fill="#e0e0e0" stroke="#333"/>
  <text x="195" y="313" font-size="11" fill="#333">Btn 2</text>
  <rect x="300" y="290" width="120" height="36" fill="#e0e0e0" stroke="#333"/>
  <text x="325" y="313" font-size="11" fill="#333">Btn 3</text>

  <!-- Floated image 25% width, text wraps -->
  <rect x="40" y="345" width="220" height="150" fill="#dcdcdc" stroke="#999"/>
  <text x="110" y="425" font-size="11" fill="#666">image 25%</text>
  <text x="280" y="360" font-size="16" fill="#222">Heading</text>
  <line x1="280" y1="380" x2="900" y2="380" stroke="#ccc"/>
  <line x1="280" y1="400" x2="900" y2="400" stroke="#ccc"/>
  <line x1="280" y1="420" x2="900" y2="420" stroke="#ccc"/>
  <line x1="280" y1="440" x2="900" y2="440" stroke="#ccc"/>
  <line x1="40" y1="510" x2="900" y2="510" stroke="#ccc"/>
  <line x1="40" y1="530" x2="700" y2="530" stroke="#ccc"/>

  <!-- Footer -->
  <rect x="0" y="580" width="960" height="60" fill="#333"/>
  <circle cx="440" cy="610" r="12" fill="#fff"/>
  <circle cx="480" cy="610" r="12" fill="#fff"/>
  <circle cx="520" cy="610" r="12" fill="#fff"/>
  <text x="410" y="640" font-size="10" fill="#999">social icons centered in footer</text>
</svg>
